name: hemolife
description: "HemoLife 2.0 - Production-grade Blood Donor & Blood Bank Management Mobile App"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
